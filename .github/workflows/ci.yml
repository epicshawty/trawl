name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Option registry is up to date
        run: |
          npm run gen:options
          git diff --exit-code src/shared/options.generated.json

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
